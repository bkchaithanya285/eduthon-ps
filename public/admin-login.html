<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Control Login - Eduthon</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--primary-orange);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.9rem;
        }

        button {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2 class="text-orange">LAUNCH CONTROL</h2>
        <form action="/api/admin/login" method="POST">
            <div class="form-group">
                <label>Command Code</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Access Key</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="hl-btn">Authenticate</button>
        </form>
        <div style="margin-top: 20px;">
            <a href="/" style="color: #666; font-size: 0.9rem;">&larr; Return to HQ</a>
        </div>
    </div>

</body>

</html>
