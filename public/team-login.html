<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Login - Eduthon</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #111 0%, #1a1a1a 100%);
        }

        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--primary-orange);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.15);
            text-align: center;
        }

        .login-box h2 {
            color: white;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .login-box p {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: var(--primary-orange);
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-orange);
            box-shadow: 0 0 10px rgba(255, 107, 0, 0.2);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-container img {
            max-width: 150px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <div class="logo-container">
            <h1 style="color:white; font-size: 2.5rem; margin:0;">EDU<span class="text-orange">THON</span></h1>
        </div>
        <h2>Team Authentication</h2>
        <p>Sign in to view and select your problem statement.</p>

        <form action="/api/team/login" method="POST">
            <div class="form-group">
                <label for="teamId">Team ID (e.g. EDUTHON-001)</label>
                <input type="text" id="teamId" name="teamId" placeholder="EDUTHON-XXX" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="hl-btn login-btn">Secure Login</button>
        </form>
    </div>

</body>

</html>
